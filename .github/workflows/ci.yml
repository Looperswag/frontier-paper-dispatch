name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install zsh for macOS scheduler contract tests
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm --prefix web run lint
      - run: npm --prefix web run typecheck
      - run: npm --prefix web run test:coverage
        env:
          FEEDBACK_SECRET: ffffffffffffffffffffffffffffffffffffffff
          WEB_BASE_URL: https://papers.example.com
      - run: npm --prefix web run build
        env:
          AUTH_OWNER_EMAIL: owner@example.com
          DEEPSEEK_API_KEY: sk-dddddddddddddddddddddddddddddddddddddddd
          FEEDBACK_SECRET: ffffffffffffffffffffffffffffffffffffffff
          RATE_LIMIT_SECRET: rrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr
          RATE_LIMIT_SECRET_VERSION: 1
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_pppppppppppppppppppppppppppppppppppppppp
          SUPABASE_URL: http://127.0.0.1:9
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          WEB_BASE_URL: https://papers.example.com
      - run: npm audit --omit=dev --audit-level=high
      - run: npm --prefix web audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web exec playwright install -- --with-deps chromium
      - run: npm --prefix web run test:e2e

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:test

  authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm --prefix web exec playwright install -- --with-deps chromium
      - run: npm run test:idor
